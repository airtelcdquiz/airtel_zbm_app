version: '3.8'

services:
  airtel_quiz_zbm_school_app:
    container_name: airtel_quiz_zbm_school_app
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./app/:/app
    ports:
      - "3000:3000"
    command: >
      sh -c "npm install && npm run dev"
    networks:
      - dokploy-network

networks:
  dokploy-network:
    external: true