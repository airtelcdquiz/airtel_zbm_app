version: '3.8'

services:
  prod_airtel_quiz_zbm_school_app:
    container_name: prod_airtel_quiz_zbm_school_app
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./app/:/app
    # `app/.env` doit exister (cf. app/.env.example) : il est chargé ici pour le
    # shell du conteneur et, comme il est monté dans /app, Next.js le lit aussi
    # au build (nécessaire pour les variables NEXT_PUBLIC_*).
    env_file:
      - ./app/.env
    expose :
      - "3000"
    command: >
      sh -c "yarn install && yarn build && yarn start"
    networks:
      - dokploy-network

networks:
  dokploy-network:
    external: true