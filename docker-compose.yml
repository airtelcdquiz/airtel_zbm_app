version: '3.8'

services: 
  airtel_quiz_zbm_school_app :
    container_name: airtel_quiz_zbm_school_app
    image: node:latest
    tty: true
    working_dir: /app
    volumes:
      - ./:/app
    expose:
      - 3000
    command: >
       bash -c "npm install && npm run dev"
    networks:
      - dokploy-network


networks:
  dokploy-network:
    external: true  # Use the previously created shared network